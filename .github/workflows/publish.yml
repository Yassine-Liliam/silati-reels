# Publishes the reel committed on the `queue` branch to Instagram.
# A push to `queue-test` runs the same flow but stops before publishing (dry run).
# The daily job force-pushes a single orphan commit to `queue` containing
# reel.mp4, caption.txt, this workflow and scripts/publish.py.
name: Publish reel

on:
  push:
    branches: [queue, queue-test]

concurrency:
  group: publish-reel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Check files
        run: |
          test -s reel.mp4 || { echo "reel.mp4 missing"; exit 1; }
          test -s caption.txt || { echo "caption.txt missing"; exit 1; }

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          VIDEO_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/reel.mp4
          DRY_RUN: ${{ github.ref_name == 'queue-test' }}
        run: python3 scripts/publish.py
