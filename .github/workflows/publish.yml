# Publishes a reel pushed by the daily job on a new branch `reel/YYYY-MM-DD`
# (a single orphan commit with reel.mp4, caption.txt, this workflow and
# scripts/publish.py). Branches `test/<anything>` run the same flow but stop
# before publishing (dry run). After success the branch is deleted, so the
# daily job never needs a force push and the repo does not grow.
name: Publish reel

on:
  push:
    branches: ["reel/**", "test/**"]

concurrency:
  group: publish-reel
  cancel-in-progress: false

permissions:
  contents: write   # only to delete the pushed branch after success

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Check files
        run: |
          test -s reel.mp4 || { echo "::error::reel.mp4 missing"; exit 1; }
          test -s caption.txt || { echo "::error::caption.txt missing"; exit 1; }

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          VIDEO_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/reel.mp4
          DRY_RUN: ${{ startsWith(github.ref_name, 'test/') }}
        run: python3 scripts/publish.py

      - name: Delete the branch
        if: success()
        run: git push origin --delete "$GITHUB_REF_NAME"
