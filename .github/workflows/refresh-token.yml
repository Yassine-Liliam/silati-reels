# Instagram long-lived tokens last 60 days. This refreshes it twice a month
# and stores the new one in the IG_ACCESS_TOKEN secret (needs GH_PAT with
# "Secrets: Read and write" on this repository).
name: Refresh Instagram token

on:
  schedule:
    - cron: "17 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh and store token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          resp=$(curl -sS --fail-with-body -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=${IG_ACCESS_TOKEN}") || {
              echo "Refresh failed: $(echo "$resp" | jq -c '.error // .' 2>/dev/null || echo "$resp")"; exit 1; }
          new=$(echo "$resp" | jq -r '.access_token // empty')
          [ -n "$new" ] || { echo "No token in response"; exit 1; }
          echo "::add-mask::$new"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$new"
          days=$(( $(echo "$resp" | jq -r '.expires_in') / 86400 ))
          echo "Token refreshed, valid ~${days} days." | tee -a "$GITHUB_STEP_SUMMARY"
